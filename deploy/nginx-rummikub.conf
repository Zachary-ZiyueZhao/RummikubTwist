# 用法：
#   1) 把这个文件放到服务器： /etc/nginx/sites-available/rummikub
#   2) 把 server_name 改成你的域名；没有域名就整行删掉或用 IP（配 server_name _）
#   3) sudo ln -s /etc/nginx/sites-available/rummikub /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # ← 改成你的域名；无域名则此行可删 / 用 _

    root /var/www/rummikub/dist;   # ← 改成本机部署目录
    index index.html;

    # 静态单页应用：找不到就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 生产环境客户端会连到同源 /ws，这里反向代理到本地 WebSocket 服务(8787)
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
